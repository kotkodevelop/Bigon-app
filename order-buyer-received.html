<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

  <body>
    <main class="orders-app orders-app--detail orders-app--review">
<header class="orders-header">

      <section class="orders-content order-detail-content" aria-label="Детали заказа">

        <section class="order-section">
          <h2>Ваш заказ <span>(3 товара)</span></h2>
          <div class="order-products-row">
      <img class="order-product-img" src="./assets/cart/cart-product.svg" alt="" />
      <img class="order-product-img" src="./assets/cart/cart-product.svg" alt="" />
      <img class="order-product-img" src="./assets/cart/cart-product.svg" alt="" />
    </div>
        </section>
        <section class="order-section">
      <h2>Продавец</h2>
      <div class="order-seller">
        <img class="order-seller__logo" src="./assets/profile/ecolife-logo.jpg" alt="Eco Life" />
        <div class="order-seller__text"><strong>Eco Life</strong><span class="order-seller__rating"><svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.63 1.02a.4.4 0 0 1 .74 0l1.2 2.52c.06.13.18.22.32.24l2.75.38a.4.4 0 0 1 .23.69L8.88 6.8a.4.4 0 0 0-.11.35l.48 2.74a.4.4 0 0 1-.58.42L6.2 9.02a.4.4 0 0 0-.38 0l-2.47 1.29a.4.4 0 0 1-.58-.42l.48-2.74a.4.4 0 0 0-.11-.35L1.13 4.85a.4.4 0 0 1 .23-.69l2.75-.38a.4.4 0 0 0 .32-.24l1.2-2.52Z" fill="#FFC24B"/></svg>10 (5)</span></div>
      </div>
    </section>
        <section class="order-section order-delivery">
      <h2>Способ получения</h2>
      <h3>5Post — пункт выдачи</h3>
      <p>Москва, ул. Дорожная, 120</p>
    </section>
        <section class="order-summary" aria-label="Сумма заказа">
      <div class="order-summary__top"><h2>Сумма заказа</h2><span class="orders-badge orders-badge--green orders-badge--wide">Оплачено</span></div>
      <div class="order-summary__rows">
        <div class="order-summary__row"><span>Товары</span><strong>6 000 ₽</strong></div>
        <div class="order-summary__row"><span>Оплата баллами</span><strong class="is-green">-500 ₽</strong></div>
        <div class="order-summary__row order-summary__row--total"><span>Итого</span><strong>5 500 ₽</strong></div>
      </div>
    </section>
      </section><div class="orders-sticky">

      <button class="orders-main-btn" type="button">Оставить отзыв</button>
      <div class="orders-sticky__row" style="margin-top:8px;"><button class="orders-secondary-btn" type="button" style="grid-column:1 / -1;">Чат с продавцом</button></div>
