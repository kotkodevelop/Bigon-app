<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Совершена покупка</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/home.css" />
    <link rel="stylesheet" href="./css/company-orders.css" />
  </head>
  <body>
    <main class="company-detail-app" aria-label="Совершена покупка">
      <header class="company-detail-header"><button class="company-detail-back" type="button" aria-label="Назад"><img src="./assets/back-btn.svg" alt="" /></button><div class="company-detail-title"><h1>Совершена покупка</h1><p>25 января 2026</p></div></header>
      <section class="company-detail-content">
        <section class="company-detail-section"><h2>Покупатель</h2><div class="company-buyer-row"><img class="company-buyer-avatar" src="./assets/no-avatar.svg" alt="" /><span>Иванова Елена Ивановна</span></div></section>
        <section class="company-detail-section"><h2>Магазин</h2><div class="company-store-row"><img src="./assets/store-card-preview.png" alt="Eco Life" /><span>Московская обл., г. Москва, ул. Ленина, д. 123</span></div></section>
        <section class="company-detail-section company-percent"><h2>Размер баллов для оплаты заказа:</h2><p>10%</p></section>
        <section class="company-sale-summary" aria-label="Сумма покупки"><div class="company-sale-summary__top"><h2>Сумма покупки</h2><span class="company-order-badge company-order-badge--green">Списаны баллы</span></div><div class="company-sale-summary__rows"><div class="company-sale-summary__row"><span>Товары</span><strong>6 000 ₽</strong></div><div class="company-sale-summary__row"><span>Оплата баллами</span><strong class="is-green">-600 ₽</strong></div><div class="company-sale-summary__row is-total"><span>Итого</span><strong>5 400 ₽</strong></div></div></section>
      </section>
      <div class="company-detail-sticky"><button style="background: #eee;" type="button">Оформить возврат</button><button style="background: #eee;" type="button">Чат с покупателем</button></div>
    </main>
  </body>
</html>
