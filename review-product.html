<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Оценить товар</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/review-feedback.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <button class="review-header__back" type="button" aria-label="Назад">
          <img src="./assets/back-btn.svg" alt="" />
        </button>
        <div class="review-header__title"><h1>Оценить товар</h1></div>
        <span></span>
      </header>

      <section class="review-content review-content--form" aria-label="Оценить товар">
        <div class="review-card-head">
          <img class="review-card-head__thumb" src="./assets/cart/cart-product.svg" alt="Штаны мужские" />
          <div class="review-card-head__title">Штаны мужские</div>
        </div>

        <div class="review-score">
          <div class="review-score__text"><span>8</span><span>Отлично</span></div>
          <div class="review-stars" aria-label="Рейтинг 8 из 10">

            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star is-muted" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
            <svg class="review-star is-muted" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill="currentColor" d="M23.937 8.616a1.202 1.202 0 0 0-1.042-.811l-6.841-.544L13.094.71a1.198 1.198 0 0 0-2.187-.001L7.947 7.26l-6.842.544A1.2 1.2 0 0 0 .362 9.86l5.056 4.928-1.788 7.741a1.2 1.2 0 0 0 1.836 1.269L12 19.442l6.534 4.356a1.201 1.201 0 0 0 1.82-1.327l-2.194-7.68 5.443-4.897c.356-.322.487-.823.334-1.278Z"/></svg>
          </div>
        </div>

        <div class="review-field">
          <div class="review-field__head">
            <label for="productReviewComment">Комментарий <em>*</em></label>
            <span class="review-bonus-badge">150 символов: +40 <img src="./assets/home/item-coin-mini.svg" alt="" /></span>
          </div>
          <textarea class="review-textarea" id="productReviewComment" placeholder="Поделитесь общим впечатлением"></textarea>
          <div class="review-field__note">Минимум 20 символов (осталось 10)</div>
        </div>

        <div class="review-upload">
          <div class="review-upload__head">
            <strong>Добавьте фотографии</strong>
            <span class="review-bonus-badge">+40 <img src="./assets/home/item-coin-mini.svg" alt="" /></span>
          </div>
          <input class="review-upload__input" id="productReviewPhotos" type="file" accept="image/*" multiple />
          <label class="review-upload__box" for="productReviewPhotos">
            <img src="./assets/Camera.svg" alt="Добавить фото" />
          </label>
        </div>
      </section>

      <div class="review-sticky">
        <button class="review-submit-btn" type="button" data-review-submit>Отправить отзыв</button>
      </div>

      <section class="review-success-modal" data-review-success-modal role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="reviewSuccessTitle" hidden>
        <button class="review-success-modal__close" type="button" data-review-modal-close aria-label="Закрыть">
          <img src="./assets/close.svg" alt="" />
        </button>
        <img class="review-success-modal__icon" src="./assets/review-success-modal.svg" alt="" />
        <h2 id="reviewSuccessTitle">Спасибо за отзыв</h2>
        <p>Ваш отзыв отправлен на модерацию и скоро будет опубликован</p>
        <button class="review-modal-btn" type="button" data-review-modal-close>Хорошо</button>
      </section>
    </main>
    <script src="./js/review-feedback.js"></script>
  </body>
</html>
