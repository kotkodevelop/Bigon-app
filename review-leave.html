<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Оставить отзыв</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/review-feedback.css" />
  </head>
  <body>
    <main class="review-shell">
      <header class="review-header">
        <button class="review-header__back" type="button" aria-label="Назад">
          <img src="./assets/back-btn.svg" alt="" />
        </button>
        <div class="review-header__title"><h1>Оставить отзыв</h1></div>
        <span></span>
      </header>

      <section class="review-content" aria-label="Оставить отзыв">
        <h2 class="review-intro">Оцените покупку и получите до +80 бонусы!</h2>

        <div class="review-rate-list">
          <article class="review-rate-item">
            <img class="review-rate-item__thumb" src="./assets/cart/cart-product.svg" alt="Eco Life" />
            <div class="review-rate-item__body">
              <div class="review-rate-item__meta">
                <span class="review-rate-item__name">Eco Life <span class="review-rate-item__sub">(Продавец)</span></span>
              </div>
              <button class="review-action-btn" type="button">Оценить</button>
            </div>
          </article>

          <article class="review-rate-item">
            <img class="review-rate-item__thumb" src="./assets/cart/cart-product.svg" alt="Штаны мужские" />
            <div class="review-rate-item__body">
              <div class="review-rate-item__meta">
                <span class="review-rate-item__name">Штаны мужские</span>
              </div>
              <button class="review-action-btn" type="button">Оценить</button>
            </div>
          </article>

          <article class="review-rate-item">
            <img class="review-rate-item__thumb" src="./assets/cart/cart-product.svg" alt="Смартфон" />
            <div class="review-rate-item__body">
              <div class="review-rate-item__meta">
                <span class="review-rate-item__name">Штаны мужские</span>
              </div>
              <button class="review-action-btn" type="button">Оценить</button>
            </div>
          </article>

          <article class="review-rate-item">
            <img class="review-rate-item__thumb" src="./assets/cart/cart-product.svg" alt="Велосипед" />
            <div class="review-rate-item__body">
              <div class="review-rate-item__meta">
                <span class="review-rate-item__name">Штаны мужские</span>
              </div>
              <button class="review-action-btn" type="button">Оценить</button>
            </div>
          </article>
        </div>

        <div class="review-hidden-spacer" aria-hidden="true"></div>
      </section>
    </main>
  </body>
</html>
