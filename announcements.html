<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Мои объявления</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/announcements.css" />
  </head>
  <body>
    <main class="ann-app" aria-label="Мои объявления">
      <section class="ann-main-screen">
        <header class="ann-main-header">
          <h1>Мои объявления</h1>
        </header>

        <nav class="ann-tabs" aria-label="Статусы объявлений">
          <button class="ann-tab is-active" type="button">Опубликованные</button>
          <button class="ann-tab" type="button">На модерации</button>
          <button class="ann-tab" type="button">На доработке</button>
        </nav>

        <div class="ann-search-row">
          <label class="ann-search">
            <img src="./assets/search.svg" alt="" aria-hidden="true" />
            <input type="search" placeholder="Название, артикул" aria-label="Поиск по объявлениям" />
          </label>
          <button class="ann-filter-btn" type="button" aria-label="Фильтры">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
              <path stroke="#0066F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.33 16.593h-6.3M13.14 6.9h6.301"/>
              <path stroke="#0066F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8.726 6.846A2.355 2.355 0 0 0 6.363 4.5 2.355 2.355 0 0 0 4 6.846a2.355 2.355 0 0 0 2.363 2.347 2.355 2.355 0 0 0 2.363-2.347ZM20 16.554a2.354 2.354 0 0 0-2.362-2.346 2.355 2.355 0 0 0-2.364 2.346 2.355 2.355 0 0 0 2.364 2.346A2.354 2.354 0 0 0 20 16.554Z" clip-rule="evenodd"/>
            </svg>
          </button>
        </div>

        <div class="ann-empty">
          <p>У вас пока нет Объявлений</p>
          <a class="state-btn state-btn--cyan state-btn--intro" href="./announcement-add.html">+ Разместить объявление</a>
        </div>

        <nav class="state-bottom-nav" aria-label="Навигация приложения">

                <path stroke="#fff" stroke-linecap="round" stroke-width="1.2" d="M8 2.667v10.667M13.333 8H2.667"/>
              </svg>
            </span>
          </a>
          <button class="state-nav-item" type="button">

              <path fill="#858585" d="M12.02 2C6.21 2 2 6.74 2 12c0 1.68.49 3.41 1.35 4.99.16.26.18.59.07.9l-.67 2.24c-.15.54.31.94.82.78l2.02-.6c.55-.18.98.05 1.491.36 1.46.86 3.279 1.3 4.919 1.3 4.96 0 10-3.83 10-10C22 6.65 17.7 2 12.02 2Z" opacity=".4" />

              <path fill="#0066F5" d="M20 17.5c0 2.485 0 4.5-8 4.5s-8-2.015-8-4.5S7.582 13 12 13s8 2.015 8 4.5Z" opacity=".5" />

    </main>

</html>
