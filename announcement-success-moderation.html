<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Объявление отправлено</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/announcements.css" />
    <link rel="stylesheet" href="./css/announcement-success.css" />
  </head>
  <body>
    <main class="ann-app ann-success-shell" aria-label="Объявление отправлено на модерацию">
      <section class="ann-main-screen" aria-hidden="true">
        <header class="ann-step-header">
          <a class="ann-back" href="./announcements.html" aria-label="Назад"><img src="./assets/back-btn.svg" alt="" /></a>
          <h1>Объявления</h1>
        </header>
      </section>

      <div class="ann-success-dim" aria-hidden="false">
        <section class="ann-success-card" role="dialog" aria-modal="true" aria-labelledby="annModerationTitle">
          <button class="ann-success-close" type="button" aria-label="Закрыть недоступно"><img src="./assets/close.svg" alt="" /></button>
          <img class="ann-success-illustration" src="./assets/ready-screen-img.svg" alt="" aria-hidden="true" />
          <h2 id="annModerationTitle">Объявление отправлено<br />на модерацию!</h2>
          <p>Мы проверим объявление и опубликуем его после модерации. Обычно это занимает до 24 часов.</p>
          <button class="ann-success-button" type="button">Хорошо</button>
        </section>
      </div>
    </main>
  </body>
</html>
