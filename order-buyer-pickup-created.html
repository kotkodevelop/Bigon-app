<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bigon.pro — Заказ создан — самовывоз</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./css/orders.css" />
    <link rel="stylesheet" href="./css/orders-more.css" />
  </head>
  <body>
    <main class="orders-app orders-app--detail orders-app--compact-detail">
      <header class="orders-header">
        <button class="orders-header__back" type="button" aria-label="Назад"><img src="./assets/back-btn.svg" alt="" /></button>
        <div class="orders-header__title"><h1>Заказ от 10.01.2026</h1><p>№ 5548641333</p></div>
      </header>
      <section class="orders-content order-detail-content" aria-label="Детали заказа">
        <div class="order-track order-track--pickup" aria-label="Статус заказа">
          <div class="order-track__item is-active">
            <span class="order-track__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path fill="currentColor" d="m17.578 4.432-2-1.05C13.822 2.461 12.944 2 12 2s-1.822.46-3.578 1.382l-.321.169 8.923 5.099 4.016-2.01c-.646-.732-1.688-1.279-3.462-2.21Zm4.17 3.532-3.998 2V13a.75.75 0 0 1-1.5 0v-2.287l-3.5 1.75v9.441c.718-.179 1.535-.607 2.828-1.286l2-1.05c2.151-1.129 3.227-1.693 3.825-2.708.597-1.014.597-2.277.597-4.8v-.117c0-1.893 0-3.076-.252-3.978ZM11.25 21.904v-9.44l-8.998-4.5C2 8.866 2 10.05 2 11.941v.117c0 2.525 0 3.788.597 4.802.598 1.015 1.674 1.58 3.825 2.709l2 1.049c1.293.679 2.11 1.107 2.828 1.286ZM2.96 6.641l9.04 4.52 3.411-1.705-8.886-5.078-.103.054c-1.773.93-2.816 1.477-3.462 2.21Z" />
              </svg>
            </span>
            <span>Создан</span>
          </div>
          <div class="order-track__item">
            <span class="order-track__icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path fill="currentColor" d="M16.528 2H7.472c-1.203 0-1.804 0-2.288.299-.483.298-.752.836-1.29 1.912L2.491 7.76c-.325.82-.608 1.786-.062 2.479A2 2 0 0 0 6 9a2 2 0 1 0 4 0 2 2 0 1 0 4 0 2 2 0 1 0 4 0 2 2 0 0 0 3.571 1.238c.546-.693.262-1.659-.062-2.479l-1.404-3.548c-.538-1.076-.806-1.614-1.29-1.912C18.332 2 17.73 2 16.528 2Z" />
                <path fill="currentColor" fill-rule="evenodd" d="M20 21.25h2a.75.75 0 0 1 0 1.5H2a.75.75 0 0 1 0-1.5h2V12.5c.744 0 1.433-.232 2-.627a3.484 3.484 0 0 0 2 .627c.744 0 1.433-.232 2-.627a3.484 3.484 0 0 0 2 .627c.744 0 1.433-.232 2-.627a3.484 3.484 0 0 0 2 .627c.744 0 1.433-.232 2-.627a3.484 3.484 0 0 0 2 .627v8.75Zm-10.5 0h5V18.5c0-.934 0-1.401-.201-1.75a1.5 1.5 0 0 0-.549-.549c-.348-.2-.815-.2-1.75-.2s-1.402 0-1.75.2a1.5 1.5 0 0 0-.549.55c-.201.348-.201.815-.201 1.75v2.75Z" clip-rule="evenodd" />
              </svg>
            </span>
            <span>Готов к выдаче</span>
          </div>
        </div>
        <section class="order-section">
          <h2>Ваш заказ <span>(2 товара)</span></h2>
          <div class="order-products-row order-products-row--two">
            <img class="order-product-img" src="./assets/cart/cart-product.svg" alt="" /><img class="order-product-img" src="./assets/cart/cart-product.svg" alt="" />
          </div>
        </section>
        <section class="order-section order-section--tight">
          <h2>Продавец</h2>
          <div class="order-seller">
            <img class="order-seller__logo" src="./assets/profile/ecolife-logo.jpg" alt="Eco Life" />
            <div class="order-seller__text"><strong>Eco Life</strong><span class="order-seller__rating"><svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5.63 1.02a.4.4 0 0 1 .74 0l1.2 2.52c.06.13.18.22.32.24l2.75.38a.4.4 0 0 1 .23.69L8.88 6.8a.4.4 0 0 0-.11.35l.48 2.74a.4.4 0 0 1-.58.42L6.2 9.02a.4.4 0 0 0-.38 0l-2.47 1.29a.4.4 0 0 1-.58-.42l.48-2.74a.4.4 0 0 0-.11-.35L1.13 4.85a.4.4 0 0 1 .23-.69l2.75-.38a.4.4 0 0 0 .32-.24l1.2-2.52Z" fill="#FFC24B"/></svg>10 (5)</span></div>
          </div>
        </section>
        <section class="order-section order-delivery order-section--tight">
          <h2>Способ получения</h2>
          <div class="order-delivery-card">
            <img class="order-delivery-card__icon" src="./assets/store-card-preview.png" alt="" />
            <div class="order-delivery-card__body">
              <h3>Самовывоз</h3>
              <p>Московская обл., г. Москва, ул. Ленина, д. 123</p>
              <div class="order-work-time">
                <span>График работы:</span>
                <span><b>пн - пт:</b> 08:00 - 18:00</span>
                <span><b>сб - вс:</b> 12:00 - 17:00</span>
              </div>
            </div>
          </div>
        </section>
        <section class="order-summary " aria-label="Сумма заказа">
          <div class="order-summary__top"><h2>Сумма заказа</h2><span class="orders-badge orders-badge--gray orders-badge--wide">Оплата при получении</span></div>
          <div class="order-summary__rows">
            <div class="order-summary__row"><span>Товары</span><strong class="">6 000 ₽</strong></div>
          </div>
        </section>
      </section>
      <div class="orders-sticky"><div class="orders-sticky__row"><button class="orders-secondary-btn" type="button">Отменить</button><button class="orders-secondary-btn" type="button">Чат с продавцом</button></div></div>
    </main>
  </body>
</html>
